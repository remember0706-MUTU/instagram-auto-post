name: Refresh Instagram Token

on:
  schedule:
    - cron: '0 0 1 * *'  # 매월 1일 00:00 UTC (09:00 KST)
  workflow_dispatch:      # 수동 실행 버튼

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: 패키지 설치
        run: pip install requests PyNaCl

      - name: 인스타그램 토큰 갱신 및 Secret 업데이트
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          PYTHONIOENCODING: utf-8
        run: |
          python3 - <<'EOF'
          import requests, base64, os, sys
          from nacl import encoding, public

          token = os.environ['INSTAGRAM_ACCESS_TOKEN']
          gh_pat = os.environ['GH_PAT']
          REPO = 'remember0706-MUTU/instagram-auto-post'

          # 1. 인스타그램 토큰 갱신
          r = requests.get(
              'https://graph.instagram.com/refresh_access_token',
              params={'grant_type': 'ig_refresh_token', 'access_token': token}
          )
          data = r.json()

          if 'access_token' not in data:
              print(f'[실패] 토큰 갱신 오류: {data}')
              sys.exit(1)

          new_token = data['access_token']
          expires_in = data.get('expires_in', '알 수 없음')
          print(f'[성공] 새 토큰 발급 완료 (유효기간: {int(expires_in)//86400}일)')

          # 2. GitHub 저장소 공개키 가져오기
          HEADERS = {
              'Authorization': f'token {gh_pat}',
              'Accept': 'application/vnd.github.v3+json'
          }
          pk_r = requests.get(
              f'https://api.github.com/repos/{REPO}/actions/secrets/public-key',
              headers=HEADERS
          )
          pk_data = pk_r.json()
          key_id = pk_data['key_id']
          pub_key = public.PublicKey(pk_data['key'], encoding.Base64Encoder())

          # 3. 새 토큰 암호화 후 Secret 업데이트
          sealed = public.SealedBox(pub_key)
          encrypted = base64.b64encode(sealed.encrypt(new_token.encode())).decode()

          res = requests.put(
              f'https://api.github.com/repos/{REPO}/actions/secrets/INSTAGRAM_ACCESS_TOKEN',
              headers=HEADERS,
              json={'encrypted_value': encrypted, 'key_id': key_id}
          )

          if res.status_code in (201, 204):
              print('[성공] GitHub Secret 업데이트 완료')
          else:
              print(f'[실패] Secret 업데이트 실패: {res.status_code} {res.text}')
              sys.exit(1)
          EOF
