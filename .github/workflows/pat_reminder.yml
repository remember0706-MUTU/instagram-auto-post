name: PAT 만료 알림 (2026-08-11 만료 예정)

on:
  schedule:
    - cron: '0 0 11 7 *'  # 2026-07-11 09:00 KST (00:00 UTC)
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest

    steps:
      - name: PAT 만료 알림
        run: |
          echo "=================================================="
          echo " 🔑 GitHub PAT 만료 30일 전 알림"
          echo "=================================================="
          echo ""
          echo " PAT(Personal Access Token)가 2026-08-11에 만료됩니다."
          echo ""
          echo " 지금 바로 새 토큰을 만들어 주세요:"
          echo " 1. https://github.com/settings/tokens 접속"
          echo " 2. 'instagram-auto-post' 토큰 삭제"
          echo " 3. 새 토큰 생성 (repo 권한, 90일)"
          echo " 4. 클로드에게 새 토큰 전달 → GH_PAT Secret 업데이트"
          echo ""
          echo " PAT를 갱신하지 않으면 2026-08-11 이후"
          echo " 인스타그램 토큰 자동 갱신이 중단됩니다."
          echo "=================================================="
          exit 1  # 실패 처리 → GitHub이 이메일 발송
