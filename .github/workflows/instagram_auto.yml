name: Instagram Auto Post

on:
  schedule:
    - cron: '30 0 * * *'  # 09:30 KST (00:30 UTC)
    - cron: '0 4 * * *'   # 13:00 KST (04:00 UTC)
    - cron: '0 8 * * *'   # 17:00 KST (08:00 UTC)
    - cron: '0 12 * * *'  # 21:00 KST (12:00 UTC)
  workflow_dispatch:       # 수동 실행 버튼

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 인스타그램 자동 게시
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python main.py test

      - name: 사용한 사진 목록 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add used_photos.json || true
          git diff --staged --quiet || git commit -m "chore: update used photos list"
          git push || true
